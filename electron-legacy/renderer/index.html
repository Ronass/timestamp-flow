<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Timestamp Flow</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="titlebar">
        <span class="brand">TIMESTAMP FLOW</span>
        <div class="actions">
          <button id="btn-format" class="ghost text-btn" type="button" title="切换 12/24 小时制">
            24H
          </button>
          <button id="btn-pin" class="ghost icon-btn" type="button" title="窗口置顶">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path
                d="M8 2.6v8.1M4.9 5.7 8 2.6l3.1 3.1M3.2 13.4h9.6"
                fill="none"
                stroke="currentColor"
                stroke-width="1.3"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
          <button id="btn-theme" class="ghost icon-btn" type="button" title="切换明暗主题">
            <svg class="icon-moon" viewBox="0 0 16 16" aria-hidden="true">
              <path
                d="M13.2 9.6A5.6 5.6 0 0 1 6.4 2.8 5.6 5.6 0 1 0 13.2 9.6z"
                fill="none"
                stroke="currentColor"
                stroke-width="1.3"
                stroke-linejoin="round"
              />
            </svg>
            <svg class="icon-sun" viewBox="0 0 16 16" aria-hidden="true">
              <circle cx="8" cy="8" r="3.2" fill="none" stroke="currentColor" stroke-width="1.3" />
              <path
                d="M8 1v1.6M8 13.4V15M15 8h-1.6M2.6 8H1M12.9 3.1l-1.1 1.1M4.2 11.8l-1.1 1.1M12.9 12.9l-1.1-1.1M4.2 4.2L3.1 3.1"
                stroke="currentColor"
                stroke-width="1.3"
                stroke-linecap="round"
              />
            </svg>
          </button>
          <button id="btn-full" class="ghost icon-btn" type="button" title="全屏（F11）">
            <svg class="icon-expand" viewBox="0 0 16 16" aria-hidden="true">
              <path
                d="M6 2H2v4M10 2h4v4M2 10v4h4M14 10v4h-4"
                fill="none"
                stroke="currentColor"
                stroke-width="1.3"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <svg class="icon-collapse" viewBox="0 0 16 16" aria-hidden="true">
              <path
                d="M6 2v4H2M10 2v4h4M6 14v-4H2M10 14v-4h4"
                fill="none"
                stroke="currentColor"
                stroke-width="1.3"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
          <button id="btn-min" class="ghost icon-btn" type="button" title="最小化">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path d="M3.5 8h9" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
            </svg>
          </button>
          <button id="btn-close" class="ghost icon-btn danger" type="button" title="关闭">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path
                d="M4 4l8 8M12 4l-8 8"
                stroke="currentColor"
                stroke-width="1.3"
                stroke-linecap="round"
              />
            </svg>
          </button>
        </div>
      </header>

      <main class="stage">
        <div class="time" id="time" role="timer" aria-live="off">
          <span class="seg" id="hours">00</span>
          <span class="colon" aria-hidden="true">:</span>
          <span class="seg" id="minutes">00</span>
          <span class="colon" aria-hidden="true">:</span>
          <span class="seg" id="seconds">00</span>
          <span class="meridiem" id="meridiem"></span>
        </div>

        <div class="meta">
          <span id="date">--</span>
          <span class="dot" aria-hidden="true"></span>
          <span id="weekday">--</span>
        </div>

        <form class="search" id="search-form" autocomplete="off">
          <select id="engine" class="engine" title="选择搜索引擎" aria-label="搜索引擎">
            <option value="bing">Bing</option>
            <option value="google">Google</option>
            <option value="baidu">百度</option>
          </select>
          <input
            id="query"
            class="query"
            type="text"
            placeholder="搜索网页…（Ctrl+K）"
            autocomplete="off"
            spellcheck="false"
            aria-label="搜索关键词"
          />
          <button class="search-btn" type="submit" title="在浏览器中搜索（Enter）" aria-label="搜索">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <circle cx="7" cy="7" r="4.3" fill="none" stroke="currentColor" stroke-width="1.4" />
              <path d="M10.2 10.2 14 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
            </svg>
          </button>
        </form>
      </main>

      <footer class="statusbar">
        <button id="btn-ts" class="chip" type="button" title="点击复制 Unix 时间戳（秒）">
          <span class="chip-label">UNIX</span>
          <span class="chip-value" id="unix">0</span>
        </button>
        <button id="btn-ts-ms" class="chip" type="button" title="点击复制 Unix 时间戳（毫秒）">
          <span class="chip-label">MS</span>
          <span class="chip-value" id="unix-ms">0</span>
        </button>
        <span class="tz" id="tz">--</span>
      </footer>

      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>

    <script src="./renderer.js"></script>
  </body>
</html>
